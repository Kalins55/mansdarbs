name: Mansdarbs checks

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
      - 'security/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mansdarbs-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: node --test tests/*.test.js
